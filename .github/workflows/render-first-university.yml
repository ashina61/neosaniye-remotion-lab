name: Render First University Layered Reel

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/first-university/**'
      - 'scripts/generate-first-university-assets.ts'
      - 'scripts/generate-first-university-voice.py'
      - 'package.json'
      - '.github/workflows/render-first-university.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check edge-tts

      - name: Generate manuscript SVG layers
        run: npm run fu:assets

      - name: Generate Turkish narration ambience and SFX
        run: npm run fu:voice

      - name: Typecheck
        run: npm run typecheck

      - name: Render high quality 1080x1920 MP4
        run: npm run render:fu

      - name: Validate duration picture and audio
        run: |
          test -s out/first-university.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/first-university.mp4)
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 out/first-university.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 out/first-university.mp4)
          AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 out/first-university.mp4)
          echo "duration=$DURATION width=$WIDTH height=$HEIGHT audio=$AUDIO"
          awk "BEGIN {exit !($DURATION > 45.0 && $DURATION < 46.0)}"
          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test -n "$AUDIO"

      - name: Upload rendered reel
        uses: actions/upload-artifact@v4
        with:
          name: first-university-layered-reel
          path: |
            out/first-university.mp4
            public/first-university/asset-manifest.json
            public/first-university/audio-manifest.json
            public/first-university/scene-*/*
            public/first-university/audio/*
            public/first-university/sfx/*
          retention-days: 7
