name: Fetch Dollar V15 Natural Voice

on:
  pull_request:
    paths:
      - '.github/workflows/fetch-dollar-v15-natural-voice.yml'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download HeyGen narration
        run: |
          curl -L --fail --retry 3 \
            'https://resource2.heygen.ai/text_to_speech/48f0581c8a8c497bb4c555eee4d87d10/7f6838b1b0f141deba891800621a4fe8/id=6473d6c4-3c3a-4662-9808-2ad8c5bba74a.wav' \
            -o dollar-v15-natural-voice.wav
          test -s dollar-v15-natural-voice.wav
          ls -lh dollar-v15-natural-voice.wav

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: dollar-v15-natural-voice
          path: dollar-v15-natural-voice.wav
          retention-days: 1
