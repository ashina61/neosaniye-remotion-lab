name: NeoSaniye Auto Factory V8.0

on:
  workflow_dispatch:
    inputs:
      topic_mode:
        description: How should the topic be selected?
        required: true
        default: random
        type: choice
        options: [random, custom]
      topic:
        description: Custom topic (used only when topic_mode=custom)
        required: false
        type: string
      category:
        description: Random topic category
        required: true
        default: any
        type: choice
        options: [any, history, science, economy, geopolitics, technology, mystery, nature]
      duration:
        description: Target duration
        required: true
        default: '46'
        type: choice
        options: ['42', '46', '50']
      language:
        description: Narration language
        required: true
        default: en
        type: choice
        options: [en, tr]
      voice:
        description: Neural voice
        required: true
        default: en-US-GuyNeural
        type: choice
        options: [en-US-GuyNeural, en-US-JennyNeural, tr-TR-AhmetNeural, tr-TR-EmelNeural]
      visual_mode:
        description: Visual generation mode
        required: true
        default: procedural
        type: choice
        options: [procedural, hybrid, ai-heavy]
      research_mode:
        description: Research source
        required: true
        default: wikipedia
        type: choice
        options: [wikipedia, none]
      strict_ai:
        description: Stop when AI planning fails
        required: true
        default: false
        type: boolean
      seed:
        description: Optional deterministic seed
        required: false
        type: string
  pull_request:
    paths:
      - 'src/auto-factory/**'
      - 'scripts/auto-factory/**'
      - 'config/auto-factory-topics.json'
      - 'config/auto-factory-topics.en.json'
      - 'public/auto-factory/plan.json'
      - '.github/workflows/auto-short-factory.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: auto-factory-v8-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TOPIC_MODE: ${{ inputs.topic_mode || 'custom' }}
      TOPIC: ${{ inputs.topic || 'How antibiotic resistance develops' }}
      CATEGORY: ${{ inputs.category || 'science' }}
      TARGET_DURATION: ${{ inputs.duration || '46' }}
      LANGUAGE: ${{ inputs.language || 'en' }}
      VOICE: ${{ inputs.voice || 'en-US-GuyNeural' }}
      VOICE_RATE: '+2%'
      VISUAL_MODE: ${{ inputs.visual_mode || 'procedural' }}
      MUSIC_MODE: off
      RESEARCH_MODE: ${{ inputs.research_mode || 'wikipedia' }}
      STRICT_AI: ${{ inputs.strict_ai || 'false' }}
      SEED: ${{ inputs.seed || github.run_number }}
      TOPIC_POOL_PATH: ${{ (inputs.language || 'en') == 'en' && 'config/auto-factory-topics.en.json' || 'config/auto-factory-topics.json' }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      POLLINATIONS_TEXT_MODEL: ${{ vars.POLLINATIONS_TEXT_MODEL || 'openai-fast' }}
      POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL || 'zimage' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core zip
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check edge-tts

      - name: Validate language and voice
        run: |
          case "${LANGUAGE}:${VOICE}" in
            en:en-*) ;;
            tr:tr-*) ;;
            *) echo "Voice ${VOICE} does not match language ${LANGUAGE}"; exit 1 ;;
          esac
          echo "Language=${LANGUAGE} Voice=${VOICE} TopicPool=${TOPIC_POOL_PATH}"

      - name: Research and build base plan
        id: plan
        run: npm run auto:plan

      - name: Normalize scene density
        id: density
        run: npx tsx scripts/auto-factory/normalize-scene-density.ts

      - name: Build V8 visual and motion direction
        id: v8
        run: npm run auto:v8

      - name: Generate optional image layers
        run: npm run auto:images

      - name: Generate continuous narration and rebuild V8 choreography
        run: npm run auto:audio

      - name: Typecheck
        run: npm run typecheck

      - name: Render Full HD V8 directed documentary
        run: npm run render:auto

      - name: Lock final duration and loudness
        run: |
          ffmpeg -y -i out/auto-factory-fullhd.mp4 \
            -map 0:v:0 -map 0:a:0 -c:v copy \
            -af "loudnorm=I=-15.5:TP=-1.5:LRA=7,apad,atrim=0:${TARGET_DURATION}" \
            -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -t "${TARGET_DURATION}" -movflags +faststart out/auto-factory-mastered.mp4
          mv out/auto-factory-mastered.mp4 out/auto-factory-fullhd.mp4

      - name: Render mobile preview
        run: |
          ffmpeg -y -i out/auto-factory-fullhd.mp4 \
            -vf scale=720:1280:flags=lanczos \
            -c:v libx264 -profile:v main -level 3.1 -preset fast -crf 23 \
            -pix_fmt yuv420p -r 30 -c:a aac -b:a 128k -ar 48000 -ac 2 \
            -t "${TARGET_DURATION}" -movflags +faststart out/auto-factory-mobile.mp4

      - name: Build V8 contact sheet
        run: |
          mkdir -p out/review
          ffmpeg -y -i out/auto-factory-fullhd.mp4 \
            -vf "fps=1/3.2,scale=270:-1,tile=3x5" -frames:v 1 out/review/contact.jpg

      - name: V8 quality control
        run: npm run auto:qc

      - name: Print QC diagnostics
        if: ${{ always() }}
        run: |
          if [ -f out/production-report.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('out/production-report.json').read_text(encoding='utf-8'))
          failed = [name for name, passed in report.get('checks', {}).items() if not passed]
          print('QC_STATUS=' + str(report.get('status')))
          print('QC_FAILED_CHECKS=' + (','.join(failed) if failed else 'none'))
          for key in (
              'scene_count', 'minimum_scene_duration', 'max_internal_silence',
              'minimum_post_speech_hold', 'final_audio_tail', 'scene_timing_errors',
              'caption_errors', 'forbidden_concept_leaks', 'minimum_image_prompt_grounding_overlap',
              'image_prompt_grounding_source', 'v8_scene_modes', 'v8_presentation_counts',
              'v8_camera_moves', 'v8_transition_types', 'v8_symbolic_count',
              'v4_rendered_near_duplicate_pairs'
          ):
              if key in report:
                  print(f'QC_{key.upper()}={report[key]}')
          PY
          else
            echo 'QC_REPORT_MISSING=true'
          fi

      - name: Build downloadable package
        run: |
          SLUG='${{ steps.plan.outputs.slug }}'
          mkdir -p "out/package/$SLUG"
          cp out/auto-factory-fullhd.mp4 "out/package/$SLUG/$SLUG-fullhd.mp4"
          cp out/auto-factory-mobile.mp4 "out/package/$SLUG/$SLUG-mobile.mp4"
          cp out/production-report.json "out/package/$SLUG/production-report.json"
          cp out/review/contact.jpg "out/package/$SLUG/contact.jpg"
          cp public/auto-factory/plan.json "out/package/$SLUG/plan.json"
          cp public/auto-factory/manifest.json "out/package/$SLUG/manifest.json"
          cp public/auto-factory/audio/final.wav "out/package/$SLUG/audio-master.wav"
          cp public/auto-factory/audio/scene-timing.json "out/package/$SLUG/scene-timing.json"
          cd out/package && zip -qr "../$SLUG-package.zip" "$SLUG"

      - name: Write summary
        if: ${{ always() }}
        run: |
          {
            echo "# NeoSaniye Auto Factory V8.0"
            echo ""
            echo "**Topic:** ${{ steps.plan.outputs.topic }}"
            echo ""
            echo "**Language / voice:** ${LANGUAGE} / ${VOICE}"
            echo ""
            echo "**Renderer:** Visual + Motion Documentary V8"
            echo ""
            echo "**Visual direction:** topic-specific realism, archive, map, macro and cutaway quotas"
            echo ""
            echo "**Motion direction:** semantic camera paths, layer choreography and transition bridges"
            echo ""
            echo "**Fixed style:** no"
            echo ""
            echo "**Branding:** NeoSaniye watermark, top-left safe area"
            echo ""
            echo "**Audio:** one continuous master with word timing"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V8 diagnostics and artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-v8-${{ steps.plan.outputs.slug || 'diagnostics' }}
          if-no-files-found: warn
          path: |
            out/${{ steps.plan.outputs.slug }}-package.zip
            out/auto-factory-fullhd.mp4
            out/auto-factory-mobile.mp4
            out/production-report.json
            out/review/contact.jpg
            public/auto-factory/plan.json
            public/auto-factory/manifest.json
            public/auto-factory/audio/final.wav
            public/auto-factory/audio/scene-timing.json
          retention-days: 7
