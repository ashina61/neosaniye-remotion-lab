name: NeoSaniye Auto Factory V3

on:
  workflow_dispatch:
    inputs:
      topic_mode:
        description: Konu nasıl seçilsin?
        required: true
        default: random
        type: choice
        options: [random, custom]
      topic:
        description: Özel konu (topic_mode=custom ise)
        required: false
        type: string
      category:
        description: Rastgele konu kategorisi
        required: true
        default: any
        type: choice
        options: [any, history, science, economy, geopolitics, technology, mystery, nature]
      duration:
        description: Hedef süre
        required: true
        default: '46'
        type: choice
        options: ['42', '46', '50']
      language:
        description: Anlatım dili
        required: true
        default: tr
        type: choice
        options: [tr, en]
      voice:
        description: Doğal neural ses
        required: true
        default: tr-TR-AhmetNeural
        type: choice
        options: [tr-TR-AhmetNeural, tr-TR-EmelNeural, en-US-GuyNeural, en-US-JennyNeural]
      visual_mode:
        description: Görsel üretim modu
        required: true
        default: procedural
        type: choice
        options: [procedural, hybrid, ai-heavy]
      research_mode:
        description: Araştırma kaynağı
        required: true
        default: wikipedia
        type: choice
        options: [wikipedia, none]
      strict_ai:
        description: AI planı üretilemezse workflow dursun mu?
        required: true
        default: false
        type: boolean
      seed:
        description: Aynı sonucu tekrarlamak için sayı; boş bırakılabilir
        required: false
        type: string
  pull_request:
    paths:
      - 'src/auto-factory/**'
      - 'scripts/auto-factory/**'
      - 'config/auto-factory-topics.json'
      - 'public/auto-factory/plan.json'
      - '.github/workflows/auto-short-factory.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: auto-factory-v3-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TOPIC_MODE: ${{ inputs.topic_mode || 'custom' }}
      TOPIC: ${{ inputs.topic || 'Antibiyotik direnci nasıl oluşuyor' }}
      CATEGORY: ${{ inputs.category || 'science' }}
      TARGET_DURATION: ${{ inputs.duration || '46' }}
      LANGUAGE: ${{ inputs.language || 'tr' }}
      VOICE: ${{ inputs.voice || 'tr-TR-AhmetNeural' }}
      VOICE_RATE: '+2%'
      VISUAL_MODE: ${{ inputs.visual_mode || 'procedural' }}
      MUSIC_MODE: off
      RESEARCH_MODE: ${{ inputs.research_mode || 'wikipedia' }}
      STRICT_AI: ${{ inputs.strict_ai || 'false' }}
      SEED: ${{ inputs.seed || github.run_number }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      POLLINATIONS_TEXT_MODEL: ${{ vars.POLLINATIONS_TEXT_MODEL || 'openai-fast' }}
      POLLINATIONS_IMAGE_MODEL: ${{ vars.POLLINATIONS_IMAGE_MODEL || 'zimage' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core zip
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check edge-tts

      - name: Research and build base plan
        id: plan
        run: npm run auto:plan

      - name: Normalize scene density
        id: density
        run: npx tsx scripts/auto-factory/normalize-scene-density.ts

      - name: Lock narration to concrete topic visuals
        id: v3
        run: npm run auto:v3

      - name: Generate optional image layers
        run: npm run auto:images

      - name: Generate one continuous narration and word timing
        run: npm run auto:audio

      - name: Typecheck
        run: npm run typecheck

      - name: Render Full HD V3 documentary
        run: npm run render:auto

      - name: Lock final duration and loudness
        run: |
          ffmpeg -y -i out/auto-factory-fullhd.mp4 \
            -map 0:v:0 -map 0:a:0 -c:v copy \
            -af "loudnorm=I=-15.5:TP=-1.5:LRA=7,apad,atrim=0:${TARGET_DURATION}" \
            -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -t "${TARGET_DURATION}" -movflags +faststart out/auto-factory-mastered.mp4
          mv out/auto-factory-mastered.mp4 out/auto-factory-fullhd.mp4

      - name: Render mobile preview
        run: |
          ffmpeg -y -i out/auto-factory-fullhd.mp4 \
            -vf scale=720:1280:flags=lanczos \
            -c:v libx264 -profile:v main -level 3.1 -preset fast -crf 23 \
            -pix_fmt yuv420p -r 30 -c:a aac -b:a 128k -ar 48000 -ac 2 \
            -t "${TARGET_DURATION}" -movflags +faststart out/auto-factory-mobile.mp4

      - name: Build V3 contact sheet
        run: |
          mkdir -p out/review
          ffmpeg -y -i out/auto-factory-fullhd.mp4 \
            -vf "fps=1/3.2,scale=270:-1,tile=3x5" -frames:v 1 out/review/contact.jpg

      - name: V3 quality control
        run: npm run auto:qc

      - name: Build downloadable package
        run: |
          SLUG='${{ steps.plan.outputs.slug }}'
          mkdir -p "out/package/$SLUG"
          cp out/auto-factory-fullhd.mp4 "out/package/$SLUG/$SLUG-fullhd.mp4"
          cp out/auto-factory-mobile.mp4 "out/package/$SLUG/$SLUG-mobile.mp4"
          cp out/production-report.json "out/package/$SLUG/production-report.json"
          cp out/review/contact.jpg "out/package/$SLUG/contact.jpg"
          cp public/auto-factory/plan.json "out/package/$SLUG/plan.json"
          cp public/auto-factory/manifest.json "out/package/$SLUG/manifest.json"
          cp public/auto-factory/audio/final.wav "out/package/$SLUG/audio-master.wav"
          cp public/auto-factory/audio/scene-timing.json "out/package/$SLUG/scene-timing.json"
          cd out/package && zip -qr "../$SLUG-package.zip" "$SLUG"

      - name: Write summary
        run: |
          {
            echo "# NeoSaniye Auto Factory V3"
            echo ""
            echo "**Konu:** ${{ steps.plan.outputs.topic }}"
            echo ""
            echo "**Profil:** ${{ steps.v3.outputs.profile }}"
            echo ""
            echo "**Sahne:** ${{ steps.v3.outputs.scene_count }}"
            echo ""
            echo "**Ses:** Tek kesintisiz neural anlatım + kelime zamanlı sahneler"
            echo ""
            echo "**Müzik:** Kapalı"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload completed V3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-v3-${{ steps.plan.outputs.slug }}
          path: |
            out/${{ steps.plan.outputs.slug }}-package.zip
            out/auto-factory-fullhd.mp4
            out/auto-factory-mobile.mp4
            out/production-report.json
            out/review/contact.jpg
            public/auto-factory/plan.json
            public/auto-factory/manifest.json
            public/auto-factory/audio/scene-timing.json
          retention-days: 7
