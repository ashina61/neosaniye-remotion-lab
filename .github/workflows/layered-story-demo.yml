name: Layered Story Demo Render

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/layered-story-demo/**'
      - '.github/workflows/layered-story-demo.yml'

permissions:
  contents: read

jobs:
  render-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Render layered story demo
        run: |
          mkdir -p out
          npx remotion render src/layered-story-demo/index.ts LayeredStoryDemo out/layered-story-demo.mp4 \
            --codec=h264 \
            --crf=16 \
            --pixel-format=yuv420p \
            --concurrency=2

      - name: Build contact sheet
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p out/review
          ffmpeg -y -i out/layered-story-demo.mp4 \
            -vf "fps=1/3.5,scale=270:-1,tile=3x2" \
            -frames:v 1 out/review/layered-story-contact.jpg

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: layered-story-demo
          retention-days: 7
          path: |
            out/layered-story-demo.mp4
            out/review/layered-story-contact.jpg
