name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Video konusu
        required: false
        default: Dünyanın İlk Trafik Işığı
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate V2 storyboard
        env:
          TOPIC: ${{ github.event.inputs.topic || 'Dünyanın İlk Trafik Işığı' }}
        run: npm run storyboard -- "$TOPIC"

      - name: Typecheck
        run: npm run typecheck

      - name: Render MP4
        run: npm run render

      - name: Upload video and storyboard
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-v2-output
          path: |
            out/video.mp4
            public/storyboard.json
          if-no-files-found: error
