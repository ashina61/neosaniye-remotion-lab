name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Video konusu
        required: false
        default: Dünyanın İlk Trafik Işığı

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: neosaniye-video
          path: out/video.mp4
