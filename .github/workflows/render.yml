name: Render Remotion V3 Pollinations

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Video konusu
        required: true
        default: İstanbul'un Fethi
      image_count:
        description: Üretilecek gerçek görsel sayısı (6-12)
        required: false
        default: '12'
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate storyboard with Pollinations
        env:
          TOPIC: ${{ github.event.inputs.topic || 'İstanbulun Fethi' }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_TEXT_MODEL: openai-fast
        run: npm run storyboard -- "$TOPIC"

      - name: Generate images with Pollinations
        continue-on-error: true
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: zimage
          IMAGE_COUNT: ${{ github.event.inputs.image_count || '12' }}
        run: npm run images

      - name: Typecheck
        run: npm run typecheck

      - name: Render MP4
        run: npm run render

      - name: Validate output
        run: |
          test -s out/video.mp4
          test -s public/storyboard.json

      - name: Upload Pollinations output
        uses: actions/upload-artifact@v4
        with:
          name: neosaniye-pollinations-output
          path: |
            out/video.mp4
            public/storyboard.json
            public/shots/*.jpg
          if-no-files-found: warn
          retention-days: 7
