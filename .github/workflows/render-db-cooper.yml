name: Render D.B. Cooper Layered Reel V2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/db-cooper/**'
      - 'scripts/generate-db-cooper-*'
      - 'public/db-cooper/**'
      - 'package.json'
      - 'src/Root.tsx'
      - '.github/workflows/render-db-cooper.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check edge-tts
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate separate layered assets
        run: npm run db:assets

      - name: Generate Turkish narration and ambience
        env:
          DB_COOPER_VOICE: tr-TR-AhmetNeural
          DB_COOPER_VOICE_RATE: '+8%'
          DB_COOPER_VOICE_PITCH: '-2Hz'
        run: npm run db:voice

      - name: Typecheck
        run: npm run typecheck

      - name: Render high-quality 1080x1920 MP4
        run: npm run render:db

      - name: Validate duration, picture and audio
        shell: bash
        run: |
          test -s out/db-cooper-v2.mp4
          test -s public/db-cooper/audio/voice-manifest.json
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/db-cooper-v2.mp4)"
          echo "Rendered duration: ${DURATION}s"
          awk -v duration="$DURATION" 'BEGIN {exit !(duration >= 45.0 && duration <= 46.2)}'
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of compact out/db-cooper-v2.mp4 | grep -q 'width=1080|height=1920'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 out/db-cooper-v2.mp4 | grep -q .

      - name: Upload voiced layered reel
        uses: actions/upload-artifact@v4
        with:
          name: db-cooper-layered-reel-v2
          path: |
            out/db-cooper-v2.mp4
            public/db-cooper/asset-manifest.json
            public/db-cooper/audio/*
            public/db-cooper/scene-*/*
          retention-days: 7
