name: V8 Visual Motion Render Smoke

on:
  pull_request:
    paths:
      - 'src/auto-factory/**'
      - 'scripts/auto-factory/**'
      - 'package.json'
      - '.github/workflows/universal-render-smoke.yml'

permissions:
  contents: read

jobs:
  render-unrelated-topic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TOPIC_MODE: custom
      TOPIC: How undersea cables carry the internet
      CATEGORY: technology
      TARGET_DURATION: '42'
      LANGUAGE: en
      VOICE: en-US-GuyNeural
      VOICE_RATE: '+2%'
      VISUAL_MODE: procedural
      MUSIC_MODE: off
      RESEARCH_MODE: wikipedia
      STRICT_AI: 'false'
      SEED: '6061'
      TOPIC_POOL_PATH: config/auto-factory-topics.en.json
      POLLINATIONS_API_KEY: ''
      POLLINATIONS_TEXT_MODEL: openai-fast
      POLLINATIONS_IMAGE_MODEL: zimage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check edge-tts

      - name: Build unrelated-topic V8 plan
        run: |
          npm run auto:plan
          npx tsx scripts/auto-factory/normalize-scene-density.ts
          npm run auto:v8
          npm run auto:images
          npm run auto:audio

      - name: Typecheck
        run: npm run typecheck

      - name: Render V8 directed video
        run: npm run render:auto

      - name: Build V8 contact sheet
        run: |
          mkdir -p out/review
          ffmpeg -y -i out/auto-factory-fullhd.mp4 -vf "fps=1/3.0,scale=270:-1,tile=3x5" -frames:v 1 out/review/v8-contact.jpg

      - name: V8 director quality control
        run: |
          npm run auto:v8:test
          python3 scripts/auto-factory/qc-v8-directors.py

      - name: Upload V8 smoke artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v8-undersea-cables-smoke
          if-no-files-found: warn
          retention-days: 3
          path: |
            out/auto-factory-fullhd.mp4
            out/production-report.json
            out/review/v8-contact.jpg
            public/auto-factory/plan.json
