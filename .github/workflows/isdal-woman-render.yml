name: Isdal Woman Reel

on:
  pull_request:
    paths:
      - 'src/isdal/**'
      - 'scripts/generate-isdal-assets.py'
      - '.github/workflows/isdal-woman-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade edge-tts
      - name: Generate visual assets and audio
        run: python scripts/generate-isdal-assets.py
      - name: Typecheck
        run: npm run typecheck
      - name: Render vertical reel
        run: >-
          npx remotion render
          src/isdal/index.ts
          IsdalWoman
          out/isdal-woman-40s.mp4
          --codec=h264
          --crf=14
          --audio-bitrate=192k
          --pixel-format=yuv420p
          --concurrency=2
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: isdal-woman-40s
          path: out/isdal-woman-40s.mp4
          retention-days: 14
          if-no-files-found: error
