name: Mary Celeste 10s Preview

on:
  pull_request:
    paths:
      - 'src/mary-celeste/**'
      - 'src/mary-celeste-preview/**'
      - 'assets-b64/mary-celeste/**'
      - 'scripts/generate-mary-celeste-audio.py'
      - '.github/workflows/mary-celeste-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MARY_CELESTE_VOICE: tr-TR-AhmetNeural
      MARY_CELESTE_VOICE_RATE: +4%
      MARY_CELESTE_VOICE_PITCH: -3Hz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode visual assets
        run: |
          mkdir -p public/mary-celeste
          cat assets-b64/mary-celeste/assets.part.* | base64 --decode > /tmp/mary-celeste-assets.zip
          unzip -o /tmp/mary-celeste-assets.zip -d public/mary-celeste
          ls -lh public/mary-celeste

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade edge-tts

      - name: Generate audio
        run: python scripts/generate-mary-celeste-audio.py

      - name: Typecheck
        run: npm run typecheck

      - name: Render 10-second preview
        run: >-
          npx remotion render
          src/mary-celeste-preview/index.ts
          MaryCelestePreview
          out/mary-celeste-preview.mp4
          --codec=h264
          --crf=14
          --audio-bitrate=192k
          --pixel-format=yuv420p
          --concurrency=2

      - name: Upload preview MP4
        uses: actions/upload-artifact@v4
        with:
          name: mary-celeste-preview
          path: out/mary-celeste-preview.mp4
          if-no-files-found: error
          retention-days: 14
