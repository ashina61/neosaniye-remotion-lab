name: Render Covid Pandemic V3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/covid-pandemic/**'
      - 'scripts/generate-covid-pandemic-audio.py'
      - 'package.json'
      - '.github/workflows/render-covid-pandemic-v2.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install --no-audit --no-fund
          python -m pip install --disable-pip-version-check edge-tts

      - name: Generate narration restrained SFX and extended score
        run: npm run covid:audio

      - name: Typecheck
        run: npm run typecheck

      - name: Render 1080x1920 MP4
        run: npm run render:covid

      - name: Validate output and ending
        run: |
          test -s out/covid-pandemic-v3.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 out/covid-pandemic-v3.mp4)
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 out/covid-pandemic-v3.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 out/covid-pandemic-v3.mp4)
          AUDIO=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 out/covid-pandemic-v3.mp4)
          echo "duration=$DURATION width=$WIDTH height=$HEIGHT audio=$AUDIO"
          awk "BEGIN {exit !($DURATION > 49.8 && $DURATION < 50.3)}"
          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test -n "$AUDIO"

      - name: Upload Covid V3 reel
        uses: actions/upload-artifact@v4
        with:
          name: covid-pandemic-v3-reel
          path: |
            out/covid-pandemic-v3.mp4
            public/covid-pandemic/audio/*
            public/covid-pandemic/sfx/*
          retention-days: 7
